[package]
name = "rustunumic"
version = "0.1.3"
edition = "2024"
authors = ["Oleg Alexandrov <alexandrovoleg.ru@gmail.com>"]
description = "Simple neural network library for Rust"
rust-version = "1.100"
readme = "README.md"
license = "MIT"
homepage = "https://cronusio.github.io/rustunumic"
documentation = "https://cronusio.github.io/rustunumic"
repository = "https://github.com/cronusio/rustunumic"
keywords = ["neural", "network", "machine", "learning", "library"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]
build = false #"build.rs"
exclude = ["/ci", "images/", ".*", "/src/tmp/"]
include = [
    #"/src",
    #"/examples",
    #"!/examples/*.md",
    "COPYRIGHT",
    "LICENSE",
]
publish = false #["some-registry-name"]

[package.metadata.scripts]
check = "cargo check"
doc = "cargo doc --open"
run = "cargo run --color=always --package perceptron --bin perceptron"
build = "cargo build"
build-release = "cargo build --release"

[lib]
#crate-type = ["cdylib"]
name = "rustunumic"
path = "src/lib.rs"
test = false
doctest = false

[workspace]
members = [
    "crates/cli",
    "examples/perceptron",
    "examples/query",
    "examples/verify",
]

[dependencies]
dotenvy = "0.15.7"
rand = "0.10.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]

[build-dependencies]

[badges]

[features]

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked" # Platform-specific.
debug-assertions = true
overflow-checks = true
lto = false
panic = "unwind"
incremental = true
codegen-units = 256
rpath = false

[profile.release]
opt-level = 3
debug = false
split-debuginfo = "unpacked" # Platform-specific.
debug-assertions = false
overflow-checks = false
lto = false
panic = "unwind"
incremental = false
codegen-units = 16
rpath = false

[profile.test]
opt-level = 1

[profile.bench]
opt-level = 1
